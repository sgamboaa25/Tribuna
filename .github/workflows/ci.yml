name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de sintaxis
        run: node --check server.js && node --check public/sw.js

      # index.html concentra todo el JS del cliente y no pasa por ESLint (ni por
      # ningún build). Este paso lo extrae a un archivo temporal y lo parsea, que
      # es lo único que detectaría un error de sintaxis en esa vista.
      - name: Sintaxis del script inline de index.html
        run: node scripts/check-inline.js index.html inline-check.js && node --check inline-check.js

      - name: Tests unitarios
        run: npm run test:unit
        env:
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_ROLE_KEY: test-key
          FOOTBALL_DATA_API_KEY: test-key
          WRITER_PASSWORD: testpass

      - name: Tests de regresión (HTTP real)
        run: npm run test:regression
        env:
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_ROLE_KEY: test-key
          FOOTBALL_DATA_API_KEY: test-key
          WRITER_PASSWORD: testpass
