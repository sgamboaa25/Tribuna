# Render Blueprint - Tribuna
# Las variables con `sync: false` no se suben a Git: Render te las pide una vez
# en el dashboard durante la creacion del Blueprint.

services:
  - type: web
    name: tribuna
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /robots.txt
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: WRITER_PASSWORD
        sync: false